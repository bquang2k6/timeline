<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { width: 512px; height: 512px; margin: 0; overflow: hidden; }
  body { background: #fff8fa; display: grid; place-items: center; }
  svg { width: 512px; height: 512px; }
</style>
<svg viewBox="0 0 512 512" role="img" aria-label="Timeline Visualizer 3D origami travel map with glowing route and location pin">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="36%" r="75%">
      <stop offset="0%" stop-color="#fffbfc"/>
      <stop offset="60%" stop-color="#fff3f7"/>
      <stop offset="100%" stop-color="#fee7f0"/>
    </radialGradient>

    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdfcfb"/>
      <stop offset="100%" stop-color="#efe5ec"/>
    </linearGradient>

    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dccdc6"/>
      <stop offset="60%" stop-color="#ecdfd7"/>
      <stop offset="100%" stop-color="#f6ede5"/>
    </linearGradient>

    <linearGradient id="p3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fcf6f9"/>
      <stop offset="100%" stop-color="#ebdfe8"/>
    </linearGradient>

    <linearGradient id="p4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0d1dc"/>
      <stop offset="50%" stop-color="#eee2ea"/>
      <stop offset="100%" stop-color="#f8f0f5"/>
    </linearGradient>

    <filter id="glowWide" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>
    <filter id="glowMed" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>

    <filter id="pinShadowFilter" x="-40%" y="-20%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="8" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pinNeonHalo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9"/>
    </filter>

    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3393"/>
      <stop offset="45%" stop-color="#e90064"/>
      <stop offset="100%" stop-color="#b00049"/>
    </linearGradient>

    <linearGradient id="pinFacet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bgGlow)"/>

  <circle cx="370" cy="160" r="160" fill="#ff76b6" opacity="0.22" filter="url(#glowWide)"/>
  <circle cx="190" cy="310" r="170" fill="#ffffff" opacity="0.35" filter="url(#glowWide)"/>

  <!-- Map Paper Drop Shadows -->
  <polygon points="76,416 168,360 258,416 348,360 436,408 436,428 348,380 258,436 168,380 76,436" fill="#3c261b" opacity="0.12" filter="url(#glowWide)"/>
  <polygon points="78,414 168,358 258,414 348,358 434,406 434,416 348,368 258,424 168,368 78,424" fill="#583c2d" opacity="0.2" filter="url(#glowMed)"/>

  <!-- Paper Bevel -->
  <polygon points="78,408 168,352 168,358 78,414" fill="#bfaea0"/>
  <polygon points="168,352 258,408 258,414 168,358" fill="#a49384"/>
  <polygon points="258,408 348,352 348,358 258,414" fill="#bfaea0"/>
  <polygon points="348,352 434,400 434,406 348,358" fill="#a49384"/>

  <!-- 4 Map Accordion Panels -->
  <polygon points="78,165 168,125 168,352 78,408" fill="url(#p1)"/>
  <polygon points="168,125 258,165 258,408 168,352" fill="url(#p2)"/>
  <polygon points="258,165 348,125 348,352 258,408" fill="url(#p3)"/>
  <polygon points="348,125 434,165 434,400 348,352" fill="url(#p4)"/>

  <polyline points="78,165 168,125 258,165 348,125 434,165 434,400 348,352 258,408 168,352 78,408 78,165" fill="none" stroke="#d5c6b7" stroke-width="1.8" stroke-linejoin="round" opacity="0.65"/>

  <!-- Topographic Relief & Contour Lines -->
  <g stroke="#b8a798" stroke-width="1.8" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M84 215 Q 124 195 164 185"/>
    <path d="M82 265 Q 124 245 164 240"/>
    <path d="M80 325 Q 126 305 164 305"/>
    <path d="M80 375 Q 124 360 164 345"/>
    <path d="M102 245 v-7 M100 241 l2 -4 l2 4" stroke-width="1.4"/>
    <path d="M138 215 v-7 M136 211 l2 -4 l2 4" stroke-width="1.4"/>
    <path d="M112 345 v-7 M110 341 l2 -4 l2 4" stroke-width="1.4"/>
  </g>

  <g stroke="#ac9a8a" stroke-width="1.8" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M172 185 Q 212 205 254 225"/>
    <path d="M172 240 Q 215 255 254 280"/>
    <path d="M172 305 Q 215 320 254 345"/>
    <path d="M205 205 v-7 M203 201 l2 -4 l2 4" stroke-width="1.4"/>
    <path d="M236 235 v-7 M234 231 l2 -4 l2 4" stroke-width="1.4"/>
  </g>

  <g stroke="#b8a798" stroke-width="1.8" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M262 225 Q 302 205 344 185"/>
    <path d="M262 280 Q 306 250 344 240"/>
    <path d="M262 345 Q 306 315 344 295"/>
    <ellipse cx="308" cy="275" rx="18" ry="9" stroke-dasharray="3,3" opacity="0.5"/>
    <path d="M285 205 v-7 M283 201 l2 -4 l2 4" stroke-width="1.4"/>
    <path d="M326 185 v-7 M324 181 l2 -4 l2 4" stroke-width="1.4"/>
  </g>

  <g stroke="#ac9a8a" stroke-width="1.8" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M352 185 Q 390 205 428 225"/>
    <path d="M352 240 Q 390 260 428 280"/>
    <path d="M352 295 Q 390 315 428 340"/>
    <ellipse cx="382" cy="235" rx="28" ry="14" stroke="#9e8b7c" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="382" cy="235" rx="16" ry="8" stroke="#9e8b7c" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Crease Highlights & Shadows -->
  <line x1="168" y1="125" x2="168" y2="352" stroke="#2a1b14" stroke-width="2.5" opacity="0.18"/>
  <line x1="258" y1="165" x2="258" y2="408" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
  <line x1="348" y1="125" x2="348" y2="352" stroke="#2a1b14" stroke-width="2.5" opacity="0.18"/>

  <!-- Vibrant Glowing Journey Route -->
  <path d="M98 342 C 114 316, 126 244, 150 242 C 174 240, 180 275, 212 284 C 248 296, 276 332, 318 300 C 354 274, 348 232, 382 206" fill="none" stroke="#e90064" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="url(#glowWide)"/>
  <path d="M98 342 C 114 316, 126 244, 150 242 C 174 240, 180 275, 212 284 C 248 296, 276 332, 318 300 C 354 274, 348 232, 382 206" fill="none" stroke="#ff2a8a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#glowMed)"/>
  <path d="M98 342 C 114 316, 126 244, 150 242 C 174 240, 180 275, 212 284 C 248 296, 276 332, 318 300 C 354 274, 348 232, 382 206" fill="none" stroke="#e90064" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M98 342 C 114 316, 126 244, 150 242 C 174 240, 180 275, 212 284 C 248 296, 276 332, 318 300 C 354 274, 348 232, 382 206" fill="none" stroke="#ff94c6" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M98 342 C 114 316, 126 244, 150 242 C 174 240, 180 275, 212 284 C 248 296, 276 332, 318 300 C 354 274, 348 232, 382 206" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- Waypoints -->
  <circle cx="98" cy="342" r="14" fill="#e90064" filter="url(#glowMed)"/>
  <circle cx="98" cy="342" r="10" fill="#ffffff"/>
  <circle cx="98" cy="342" r="5" fill="#e90064"/>

  <circle cx="166" cy="248" r="4.5" fill="#ffffff" filter="url(#glowMed)"/>
  <circle cx="166" cy="248" r="3" fill="#ffffff"/>

  <circle cx="282" cy="318" r="4.5" fill="#ffffff" filter="url(#glowMed)"/>
  <circle cx="282" cy="318" r="3" fill="#ffffff"/>

  <!-- 3D Destination Pin -->
  <ellipse cx="382" cy="208" rx="22" ry="11" fill="#24191d" opacity="0.35"/>
  <ellipse cx="382" cy="206" rx="15" ry="7.5" fill="#e90064" opacity="0.85"/>
  <ellipse cx="382" cy="206" rx="8" ry="4" fill="#ffffff"/>

  <path d="M382 206 C 388 206, 416 216, 432 218 C 440 219, 448 212, 444 200 C 438 186, 412 194, 382 206 Z" fill="#2c1720" opacity="0.35" filter="url(#glowMed)"/>
  <path d="M382 66 C 350 66, 324 92, 324 124 C 324 156, 382 206, 382 206 S 440 156, 440 124 C 440 92, 414 66, 382 66 Z" fill="#e90064" opacity="0.38" filter="url(#pinNeonHalo)"/>

  <g filter="url(#pinShadowFilter)">
    <path d="M382 68 C 352 68, 328 92, 328 122 C 328 154, 382 206, 382 206 S 436 154, 436 122 C 436 92, 412 68, 382 68 Z" fill="url(#pinGrad)"/>
    <path d="M382 68 C 352 68, 328 92, 328 122 C 328 154, 382 206, 382 206 V 68 Z" fill="url(#pinFacet)"/>
    <path d="M382 68 V 206 S 436 154, 436 122 C 436 92, 412 68, 382 68 Z" fill="#000000" opacity="0.12"/>
    <ellipse cx="382" cy="82" rx="26" ry="9" fill="#ffffff" opacity="0.35"/>
    <circle cx="382" cy="122" r="26" fill="#ffffff"/>
    <circle cx="382" cy="122" r="18" fill="#e90064"/>
    <polygon points="378,113 392,122 378,131" fill="#ffffff"/>
  </g>
</svg>
</html>
